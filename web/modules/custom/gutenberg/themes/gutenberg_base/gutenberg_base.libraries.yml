# Web fonts of the design system (Rubik and JetBrains Mono from Google Fonts).
# Override this library in a sub-theme to self-host or swap the fonts; the
# editor canvas loads them from css/tokens/fonts.css instead.
fonts:
  css:
    base:
      'https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap': { type: external, minified: true }

global:
  css:
    base:
      css/tokens/colors.css: {}
      css/tokens/typography.css: {}
      css/tokens/spacing.css: {}
      css/tokens/effects.css: {}
      css/tokens/wp-presets.css: {}
      css/theme/base.css: {}
      css/icons.css: {}
    layout:
      css/theme/layout.css: {}
    component:
      css/theme/drupal.css: {}
      css/theme/forms.css: {}
      css/theme/blocks.css: {}
      css/header-overlay.css: {}
    theme:
      css/theme/weight-light.css: {}
      css/round-buttons.css: {}
  js:
    js/navigation.js: {}
    js/messages.js: {}
  dependencies:
    - core/drupal
    - core/once
    - gutenberg_base/fonts

dark-mode:
  js:
    js/dark-mode.js: {}
  dependencies:
    - core/drupal
    - core/once

# Loaded on the node form (see libraries-edit in gutenberg_base.gutenberg.yml).
# The scripts use the wp.* globals of the editor, hence the gutenberg/*
# dependencies.
editor:
  js:
    js/editor.js: {}
    js/cover-header-overlay.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - gutenberg/hooks
    - gutenberg/blocks
    - gutenberg/block-editor
    - gutenberg/components
    - gutenberg/compose
    - gutenberg/data
    - gutenberg/element
